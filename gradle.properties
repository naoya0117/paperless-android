# Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official

# Android
android.useAndroidX=true

# App version (SemVer). versionCode must be major * 10000 + minor * 100 + patch (checked by the build); it is
# written out so that F-Droid's update check can read it.
paperless.versionName=0.2.0
paperless.versionCode=200
