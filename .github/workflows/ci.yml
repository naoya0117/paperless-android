# Development CI: builds, unit tests, Lint and ktlint on every pull request and on main.
# Releases are built by .github/workflows/release.yml when a tag `vX.Y.Z` is pushed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # build-tools: AGP's default version (installed on demand otherwise).
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # Robolectric's Android jars and its native runtime are large (150 MB or more each), and Maven Central
      # rate-limits shared CI addresses for them (HTTP 429). Google's mirror of Maven Central serves the same
      # artifacts. Added here rather than in settings.gradle.kts: F-Droid's scanner rejects repositories it does
      # not know.
      - name: Fetch Robolectric's large jars from a mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/robolectric-mirror.init.gradle.kts <<'INIT'
          settingsEvaluated {
              dependencyResolutionManagement.repositories {
                  exclusiveContent {
                      forRepository {
                          maven("https://maven-central.storage-download.googleapis.com/maven2/") {
                              name = "MavenCentralGoogleMirror"
                          }
                      }
                      filter {
                          includeModule("org.robolectric", "android-all-instrumented")
                          includeModule("org.robolectric", "nativeruntime-dist-compat")
                      }
                  }
              }
          }
          INIT

      - name: Debug build
        run: ./gradlew assembleDebug --console=plain

      - name: Unit tests
        run: ./gradlew test --console=plain

      - name: Release build
        run: ./gradlew assembleRelease --console=plain

      # `build` = assemble + check (Lint, ktlint); the earlier outputs are up to date.
      - name: Lint and remaining checks
        run: ./gradlew build --console=plain

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
