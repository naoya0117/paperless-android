name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Show runner environment
        run: |
          uname -m
          nproc
          free -h

      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # build-tools: AGP's default version (installed on demand otherwise).
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # The runner host has little free memory and the Gradle daemon was OOM-killed during
      # R8 / Lint. Keep a single worker, a small heap with SerialGC, compile Kotlin in-process
      # (no separate Kotlin daemon), and split the build into stages with a fresh daemon each.
      - name: Configure Gradle for low memory
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=1g -XX:+UseSerialGC -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          org.gradle.parallel=false
          kotlin.compiler.execution.strategy=in-process
          PROPS
          free -m

      - name: Debug build and unit tests
        run: ./gradlew assembleDebug test --console=plain && ./gradlew --stop

      - name: Release build
        run: ./gradlew assembleRelease --console=plain && ./gradlew --stop

      # `build` = assemble + check (Lint, ktlint); the earlier outputs are up to date.
      - name: Lint and remaining checks
        run: ./gradlew build --console=plain

      - name: Show memory
        if: always()
        run: free -m

      # upload-artifact v4 requires Gitea 1.23 or later.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
