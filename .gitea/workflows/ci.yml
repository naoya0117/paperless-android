name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Show runner environment
        run: |
          uname -m
          nproc
          free -h

      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # build-tools: AGP's default version (installed on demand otherwise).
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # Compile, unit tests, Android Lint, ktlint, debug/release APKs.
      # The runner host has little free memory, so cap the Gradle heap, run the Kotlin compiler
      # in-process (no separate Kotlin daemon) and limit parallel workers.
      - name: Build
        run: >-
          ./gradlew build --console=plain
          --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process

      # upload-artifact v4 requires Gitea 1.23 or later.
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
